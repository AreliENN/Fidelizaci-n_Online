<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2E7D32">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.json">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/UpUp/1.1.0/upup.min.js"></script>
  <script src="./upup.js"></script>
  <script defer src="./offline.js"></script>
  <script defer src="./instalar.js"></script>

  <title>Mi PWA - Pruebas</title>
</head>

<body style="background:#eef2f5">

  <nav class="navbar navbar-light bg-light shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Mi PWA</span>
      <a href="index.html" class="btn btn-outline-primary btn-sm">Mi Cuenta</a>
    </div>
  </nav>

  <div class="container py-4">

    <div class="text-center mb-4">
      <h2 class="fw-bold">PWA de Pruebas</h2>
      <p class="text-muted">Integración demo de APIs y funciones</p>

      <img src="./icons/icon-512x512.png"
           class="rounded shadow-sm"
           style="width:120px;height:120px;object-fit:cover;border:3px solid #ccc;">
    </div>

    <!-- Card Instalación -->
    <div class="card shadow-sm mb-4 border-0" style="border-radius:16px;">
      <div class="card-body">
        <h5 class="card-title fw-bold">Instalación y Notificaciones</h5>
        <p>Puedes instalar la PWA y probar notificaciones push.</p>

        <div class="d-grid gap-2">
          <button id="btnInstalar" class="btn btn-success">Instalar PWA</button>
          <button id="btnNotificar" class="btn btn-warning">Probar Notificación</button>
        </div>

        <p class="mt-3" id="status" style="font-weight:bold;">
          Estado: no suscrito
        </p>
      </div>
    </div>

    <!-- Card Contact Picker -->
    <div class="card shadow-sm mb-4 border-0" style="border-radius:16px;">
      <div class="card-body">
        <h5 class="card-title fw-bold">Selector de Contactos</h5>
        <p>Prueba la API de selección de contactos en Android Chrome.</p>

        <div class="d-grid gap-2">
          <button id="btnProbar" class="btn btn-primary">Verificar Soporte</button>
          <button id="btnElegir" class="btn btn-dark">Elegir Contacto</button>
        </div>

        <p class="mt-3" id="resultado"></p>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="index.html" class="btn btn-outline-secondary btn-lg">Volver a Mi Cuenta</a>
    </div>

  </div>

  <!-- =====================================================
        SCRIPTS DE FUNCIONES
  ====================================================== -->

  <!-- ========= NOTIFICACIONES ========= -->
  <script>
    const publicVapidKey = "TU_CLAVE_PUBLICA_VAPID"; // si no tienes servidor, ignóralo

    async function initPush() {
      if (!("serviceWorker" in navigator)) {
        alert("Este navegador no soporta Service Workers.");
        return;
      }

      // Registrar SW
      const register = await navigator.serviceWorker.register("./sw.js");

      let subscription = await register.pushManager.getSubscription();
      if (subscription) {
        document.getElementById("status").textContent = "Estado: suscrito";
        return;
      }

      // Pedir permisos
      const perm = await Notification.requestPermission();
      if (perm !== "granted") {
        alert("Permiso de notificaciones denegado.");
        return;
      }

      // Crear suscripción
      subscription = await register.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
      });

      document.getElementById("status").textContent = "Estado: suscrito";
      console.log("Subscripción creada:", subscription);
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(base64);
      return new Uint8Array([...raw].map(c => c.charCodeAt(0)));
    }

    // Botón de prueba de notificación local
    document.getElementById("btnNotificar").addEventListener("click", () => {
      if (Notification.permission === "granted") {
        new Notification("🔔 Notificación de Prueba", {
          body: "Esto es una notificación local en tu PWA.",
          icon: "./icons/icon-192x192.png"
        });
      } else {
        alert("Debes suscribirte primero o permitir notificaciones.");
      }
    });

    window.addEventListener("load", initPush);
  </script>

  <!-- ========= CONTACT PICKER API ========= -->
  <script>
    const r = document.getElementById("resultado");

    function soportaContactPicker() {
      return ("contacts" in navigator) &&
             ("select" in navigator.contacts) &&
             window.isSecureContext;
    }

    document.getElementById("btnProbar").addEventListener("click", () => {
      r.textContent = soportaContactPicker()
        ? "✔ Tu navegador soporta Contact Picker API."
        : "✘ No soportado (usa Chrome en Android).";
    });

    document.getElementById("btnElegir").addEventListener("click", async () => {
      if (!soportaContactPicker()) {
        r.textContent = "API no disponible.";
        return;
      }

      try {
        const contactos = await navigator.contacts.select(
          ["name", "tel", "email"],
          { multiple: false }
        );

        r.textContent = "Elegiste: " + JSON.stringify(contactos);
      } catch (e) {
        r.textContent = "Operación cancelada o bloqueada.";
      }
    });
  </script>

</body>
</html>
